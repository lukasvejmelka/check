<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematický trenažér</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    <style>
        /* Výrazné táhlo (kolečko) posuvníku přesahující osu nahoru a dolů */
        input[type=range]::-webkit-slider-thumb {
            pointer-events: auto;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 3px solid #0f172a;
            -webkit-appearance: none;
            margin-top: -7px;
        }
        input[type=range]::-moz-range-thumb {
            pointer-events: auto;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 3px solid #0f172a;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 16px;
            border-radius: 9999px;
            background: transparent;
        }
        input[type=range]::-moz-range-track {
            height: 16px;
            border-radius: 9999px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Hlavička -->
    <header class="w-full max-w-2xl mx-auto p-4 flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 gap-3">
        <div>
            <h1 id="app-title" class="text-xl font-bold text-slate-100">Matematický trenažér</h1>
            <p id="app-subtitle" class="text-xs text-slate-400">Načítání sady...</p>
        </div>
        <!-- Výběr sady / Našeptávač -->
        <div class="w-full sm:w-auto flex items-center gap-2">
            <label for="dataset-input" class="text-xs text-slate-400 whitespace-nowrap">Sada:</label>
            <input list="datasets-list" id="dataset-input" class="bg-slate-800 text-slate-100 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-slate-500 w-full sm:w-48" placeholder="Vyberte nebo napište...">
            <datalist id="datasets-list">
                <!-- Dynamicky plněno ze seznamu sad -->
            </datalist>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="w-full max-w-2xl mx-auto p-4 flex-1 flex flex-col justify-start my-auto">

        <!-- Posuvník / Indikátor pozice (Sekvenční režim) -->
        <div id="sequential-nav-container" class="mb-4">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span id="current-chapter-badge" class="px-2 py-0.5 bg-slate-800 rounded font-medium">Načítání...</span>
                <div>
                    Příklad <input type="number" id="problem-input" min="1" max="1" class="w-12 text-center bg-slate-800 text-slate-100 border border-slate-700 rounded px-1 py-0.5 text-xs font-bold focus:outline-none focus:border-slate-500"> / <span id="total-count">1</span>
                </div>
            </div>
            <!-- Barevně rozlišená osa s výrazným sliderem -->
            <div class="relative w-full h-4 bg-slate-800 rounded-full overflow-visible" id="progress-bar-track">
                <input type="range" id="slider-range" min="1" max="1" value="1" class="absolute top-0 left-0 w-full h-full appearance-none bg-transparent cursor-pointer z-10">
            </div>
        </div>

        <!-- Progress bar pro náhodný režim -->
        <div id="random-nav-container" class="mb-4 hidden">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span class="text-amber-400 font-medium">Režim náhodného předkládání</span>
                <span id="random-progress-text">Příklad 1 z 1</span>
            </div>
            <div class="relative w-full h-4 bg-slate-800 rounded-full overflow-visible cursor-pointer" id="random-track">
                <div id="random-progress-bar" class="absolute top-0 left-0 h-full bg-amber-500 rounded-full transition-all duration-300 pointer-events-none" style="width: 1%;"></div>
                <input type="range" id="random-slider" min="0" max="0" value="0" class="absolute top-0 left-0 w-full h-full appearance-none bg-transparent cursor-pointer z-10">
            </div>
        </div>

        <!-- Tlačítka Předchozí a Následující -->
        <div class="flex justify-between gap-4 mb-2">
            <button id="prev-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow border border-slate-700 transition flex items-center justify-center gap-2 text-sm">
                ← Předchozí
            </button>
            <button id="next-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow border border-slate-700 transition flex items-center justify-center gap-2 text-sm">
                Následující →
            </button>
        </div>

        <!-- Karta s příkladem -->
        <div id="math-card" class="bg-white text-slate-900 rounded-2xl p-6 shadow-2xl border-4 border-slate-700 min-h-[160px] h-auto flex flex-col justify-center items-center text-center cursor-pointer relative overflow-visible transition-all my-2">
            <div id="math-content" class="w-full overflow-x-auto overflow-y-visible py-4 px-2 text-lg md:text-xl font-medium">
                Načítání sady...
            </div>
            <div class="absolute bottom-1 right-3 text-[10px] text-slate-400 pointer-events-none">
                (Klepnutí / [Mezerník] / [Šipky] = Navigace)
            </div>
        </div>

        <!-- Přepínač režimu: Výsledek / Postup -->
        <div class="mt-4 bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-xs font-medium text-slate-300">Zobrazení v kartě:</span>
            <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-700 w-full sm:w-auto">
                <button id="mode-result" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow">
                    Jen výsledek
                </button>
                <button id="mode-steps" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">
                    Postup řešení
                </button>
            </div>
        </div>

        <!-- Pokročilá nastavení -->
        <div class="mt-3 space-y-2 bg-slate-800/50 p-3 rounded-xl border border-slate-800 text-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="no-worksheets-chk" class="w-4 h-4 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
                    <span class="font-medium text-slate-300">Režim bez pracovního listu (jen zadání)</span>
                </label>
                <label id="continuous-result-wrapper" class="flex items-center gap-2 cursor-pointer pl-6 sm:pl-0 opacity-50 pointer-events-none transition">
                    <input type="checkbox" id="continuous-result-chk" class="w-3.5 h-3.5 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
                    <span class="text-slate-400">Zobrazovat průběžně výsledky</span>
                </label>
            </div>

            <div class="border-t border-slate-700/60 pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="random-mode-chk" class="w-4 h-4 rounded text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                    <span class="font-medium text-amber-400">Režim náhodného předkládání (promíchat sadu)</span>
                </label>
                <div id="random-suboptions" class="mt-2 pl-6 space-y-1 hidden">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="interleave" checked class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Prokládat výsledky (zadání -> výsledek -> další)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="only-statements" class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Procházet jen zadání</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="instant-results" class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Zobrazovat ihned s výsledky</span>
                    </label>
                </div>
            </div>
        </div>

    </main>

    <!-- Zápatí -->
    <footer class="w-full max-w-2xl mx-auto p-4 border-t border-slate-800 text-center text-xs text-slate-500 flex justify-between items-center">
        <span>Matematický trenažér v2.1</span>
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="vibration-chk" checked class="w-3.5 h-3.5 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
            <span>Hmatová odezva (vibrace)</span>
        </label>
    </footer>

        let problems = [];

        const modeStepsBtn = document.getElementById('mode-steps');

        const continuousResultChk = document.getElementById('continuous-result-chk');
        const continuousResultWrapper = document.getElementById('continuous-result-wrapper');

        const randomNavContainer = document.getElementById('random-nav-container');

        const randomProgressText = document.getElementById('random-progress-text');
        const randomSlider = document.getElementById('random-slider');

        const datasetsList = document.getElementById('datasets-list');
        const appTitle = document.getElementById('app-title');
        const appSubtitle = document.getElementById('app-subtitle');

        function vibrate() {
            if (vibrationChk.checked && navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        function hasDetailedSteps(problem) {
            const steps = problem.steps;
            const equalsCount = (steps.match(/=/g) || []).length;
            return equalsCount > 1;
        }

        function updateStepsButtonState(problem) {
            if (hasDetailedSteps(problem)) {
                modeStepsBtn.removeAttribute('disabled');
            } else {
                modeStepsBtn.setAttribute('disabled', 'true');
                currentMode = 'result';
                modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
                modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
            }
        }

        function render() {
            if (problems.length === 0) return;

            let pIndex;
            if (isRandomMode) {
                pIndex = randomIndices[currentIndex];
            } else {
                pIndex = currentIndex;
            }

            const problem = problems[pIndex];
            const probNum = problem.id;
            const statement = problem.statement;
            const answer = problem.answer;
            const steps = problem.steps;

            updateStepsButtonState(problem);

            let htmlString = "";

            if (isRandomMode) {
                const subOpt = document.querySelector('input[name="random-sub"]:checked').value;
                
                if (subOpt === 'only-statements') {
                    htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                } else if (subOpt === 'instant-results') {
                    htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                } else {
                    if (randomStepPointer === 0) {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                    }
                }

                const progressPct = ((currentIndex + 1) / problems.length) * 100;
                randomProgressBar.style.width = `${progressPct}%`;
                randomProgressText.innerText = `Příklad ${currentIndex + 1} z ${problems.length}`;
                randomSlider.value = currentIndex;

            } else {
                const noWorksheets = noWorksheetsChk.checked;
                const isContinuous = continuousResultChk.checked;

                if (noWorksheets) {
                    if (isContinuous) {
                        if (currentMode === 'steps' && hasDetailedSteps(problem)) {
                            htmlString = `\\mathbf{${probNum})} \\quad ${steps}`;
                        } else {
                            if (nonWorksheetStepPointer === 0) {
                                htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                            } else {
                                htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                            }
                        }
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                    }
                } else {
                    if (currentMode === 'steps' && hasDetailedSteps(problem)) {
                        htmlString = `\\mathbf{${probNum})} \\quad ${steps}`;
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                    }
                }

                problemInput.value = probNum;
                sliderRange.value = probNum;
                
                currentChapterBadge.innerText = problem.chapterTitle;
                currentChapterBadge.className = `px-2 py-0.5 bg-slate-800 rounded font-medium ${problem.chapterColor}`;
            }

            mathContent.innerHTML = `$${htmlString}$`;

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([mathContent]).catch((err) => console.log(err));
            }
        }

        function goNext() {
            vibrate();
            if (isRandomMode) {
                const subOpt = document.querySelector('input[name="random-sub"]:checked').value;
                if (subOpt === 'interleave') {
                    if (randomStepPointer === 0) {
                        randomStepPointer = 1;
                        render();
                        return;
                    } else {
                        randomStepPointer = 0;
                    }
                }
                
                if (currentIndex < problems.length - 1) {
                    currentIndex++;
                    render();
                } else {
                    if (subOpt === 'interleave') {
                        randomStepPointer = 1;
                    }
                    render();
                }
            } else {
                const noWorksheets = noWorksheetsChk.checked;
                const isContinuous = continuousResultChk.checked;

                if (noWorksheets && isContinuous) {
                    if (currentMode === 'result') {
                        if (nonWorksheetStepPointer === 0) {
                            nonWorksheetStepPointer = 1;
                            render();
                            return;
                        } else {
                            if (currentIndex < problems.length - 1) {
                                currentIndex++;
                                nonWorksheetStepPointer = 0;
                                render();
                                return;
                            } else {
                                nonWorksheetStepPointer = 1;
                                render();
                                return;
                            }
                        }
                    } else {
                        currentMode = 'result';
                        nonWorksheetStepPointer = 0;
                    }
                } else {
                    currentMode = 'result';
                }

                modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
                modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";

                if (currentIndex < problems.length - 1) {
                    currentIndex++;
                    nonWorksheetStepPointer = 0;
                    render();
                } else {
                    render();
                }
            }
        }

        function goPrev() {
            vibrate();
            if (isRandomMode) {
                randomStepPointer = 0;
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                }
            } else {
                nonWorksheetStepPointer = 0;
                currentMode = 'result';
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                }
            }
        }

        // Načtení sady z interního registru
        function loadDataset(datasetId) {
            // Najít v registru podle ID nebo názvu
            let foundKey = Object.keys(datasetRegistry).find(key => key.toLowerCase() === datasetId.toLowerCase());
            
            if (!foundKey) {
                foundKey = Object.keys(datasetRegistry).find(key => 
                    datasetRegistry[key].meta.name.toLowerCase().includes(datasetId.toLowerCase())
                );
            }

            const targetKey = foundKey || Object.keys(datasetRegistry)[0];
            const data = datasetRegistry[targetKey];

            appTitle.innerText = data.meta.name;
            appSubtitle.innerText = data.meta.description;
            datasetInput.value = data.meta.name;

            // Zpracování kapitol a zploštění do jednoho pole
            problems = [];
            data.chapters.forEach(chap => {
                chap.problems.forEach(prob => {
                    problems.push({
                        ...prob,
                        chapterTitle: chap.title,
                        chapterColor: chap.color || "text-slate-300"
                    });
                });
            });

            problemInput.max = problems.length;
            sliderRange.max = problems.length;
            totalCountSpan.innerText = problems.length;
            randomSlider.max = problems.length - 1;

            currentIndex = 0;
            currentMode = 'result';
            nonWorksheetStepPointer = 0;
            
            if (isRandomMode) {
                initRandomIndices();
            }

            render();
        }

        function initRandomIndices() {
            randomIndices = Array.from({length: problems.length}, (_, i) => i);
            for (let i = randomIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [randomIndices[i], randomIndices[j]] = [randomIndices[j], randomIndices[i]];
            }
            randomStepPointer = 0;
        }

        // Inicializace našeptávače v datalistu
        function initDatasetSelector() {
            datasetsList.innerHTML = '';
            Object.values(datasetRegistry).forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.meta.name;
                datasetsList.appendChild(opt);
            });
        }

        // Eventy
        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);
        mathCard.addEventListener('click', goNext);

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
            if (e.target === datasetInput) return;

            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                goNext();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                goPrev();
            }
        });

        datasetInput.addEventListener('change', (e) => {
            loadDataset(e.target.value);
        });

        modeResultBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentMode = 'result';
            modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
            modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
            render();
        });

        modeStepsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (modeStepsBtn.hasAttribute('disabled')) return;
            currentMode = 'steps';
            modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
            modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white";
            render();
        });

        noWorksheetsChk.addEventListener('change', () => {
            if (noWorksheetsChk.checked) {
                continuousResultWrapper.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                continuousResultWrapper.classList.add('opacity-50', 'pointer-events-none');
            }
            currentMode = 'result';
            nonWorksheetStepPointer = 0;
            render();
        });

        continuousResultChk.addEventListener('change', () => {
            nonWorksheetStepPointer = 0;
            render();
        });

        randomModeChk.addEventListener('change', () => {
            isRandomMode = randomModeChk.checked;
            if (isRandomMode) {
                noWorksheetsChk.checked = false;
                continuousResultWrapper.classList.add('opacity-50', 'pointer-events-none');
                randomSuboptions.classList.remove('hidden');
                sequentialNavContainer.classList.add('hidden');
                randomNavContainer.classList.remove('hidden');
                initRandomIndices();
                currentIndex = 0;
            } else {
                randomSuboptions.classList.add('hidden');
                randomNavContainer.classList.add('hidden');
                sequentialNavContainer.classList.remove('hidden');
                currentIndex = 0;
            }
            currentMode = 'result';
            nonWorksheetStepPointer = 0;
            render();
        });

        document.querySelectorAll('input[name="random-sub"]').forEach(radio => {
            radio.addEventListener('change', () => {
                randomStepPointer = 0;
                render();
            });
        });

        problemInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > problems.length) val = problems.length;
            currentIndex = val - 1;
            currentMode = 'result';
            nonWorksheetStepPointer = 0;
            render();
        });

        sliderRange.addEventListener('input', (e) => {
            currentIndex = parseInt(e.target.value) - 1;
            currentMode = 'result';
            nonWorksheetStepPointer = 0;
            render();
        });

        randomSlider.addEventListener('input', (e) => {
            currentIndex = parseInt(e.target.value);
            randomStepPointer = 0;
            render();
        });

        // Start při načtení stránky
        window.addEventListener('DOMContentLoaded', () => {
            initDatasetSelector();

            // Kontrola URL parametru např. ?set=odmocniny-mocniny-96
            const urlParams = new URLSearchParams(window.location.search);
            const setParam = urlParams.get('set') || urlParams.get('id') || urlParams.get('sada');

            if (setParam) {
                loadDataset(setParam);
            } else {
                loadDataset("odmocniny-mocniny-96"); // Výchozí sada
            }
        });
    </script>
</body>
</html>
