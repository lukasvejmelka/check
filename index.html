<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procvičování odmocnin a mocnin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    <style>
        /* Výrazné táhlo (kolečko) posuvníku přesahující osu nahoru a dolů */
        input[type=range]::-webkit-slider-thumb {
            pointer-events: auto;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 3px solid #0f172a;
            -webkit-appearance: none;
            margin-top: -7px;
        }
        input[type=range]::-moz-range-thumb {
            pointer-events: auto;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 3px solid #0f172a;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 16px;
            border-radius: 9999px;
            background: transparent;
        }
        input[type=range]::-moz-range-track {
            height: 16px;
            border-radius: 9999px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Hlavička -->
    <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-xl font-bold text-slate-100">Odmocniny a mocniny</h1>
            <p class="text-xs text-slate-400">Interaktivní pracovní list (96 příkladů)</p>
        </div>
        <!-- Logo -->
        <div id="logo-container">
            <img src="logo.png" alt="Logo" class="h-10 w-auto object-contain hidden" id="app-logo" onerror="this.style.display='none'">
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="w-full max-w-2xl mx-auto p-4 flex-1 flex flex-col justify-center">

        <!-- Posuvník / Indikátor pozice (Sekvenční režim) -->
        <div id="sequential-nav-container" class="mb-4">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span id="current-chapter-badge" class="px-2 py-0.5 bg-slate-800 rounded font-medium">I. Základní odmocniny</span>
                <div>
                    Příklad <input type="number" id="problem-input" min="1" max="96" class="w-12 text-center bg-slate-800 text-slate-100 border border-slate-700 rounded px-1 py-0.5 text-xs font-bold focus:outline-none focus:border-slate-500"> / <span id="total-count">96</span>
                </div>
            </div>
            <!-- Barevně rozlišená osa s výrazným sliderem -->
            <div class="relative w-full h-4 bg-slate-800 rounded-full overflow-visible" id="progress-bar-track">
                <div class="absolute top-0 left-0 h-full flex w-full pointer-events-none rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500/70" style="width: 25%;" title="1-24: I. Základní"></div>
                    <div class="h-full bg-emerald-500/70" style="width: 41.66%;" title="25-64: II. Částečné odmocňování"></div>
                    <div class="h-full bg-amber-500/70" style="width: 16.66%;" title="65-80: III. Operace"></div>
                    <div class="h-full bg-purple-500/70" style="width: 16.66%;" title="81-96: IV. Kombinace"></div>
                </div>
                <input type="range" id="slider-range" min="1" max="96" value="1" class="absolute top-0 left-0 w-full h-full appearance-none bg-transparent cursor-pointer z-10">
            </div>
        </div>

        <!-- Progress bar pro náhodný režim -->
        <div id="random-nav-container" class="mb-4 hidden">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span class="text-amber-400 font-medium">Režim náhodného předkládání</span>
                <span id="random-progress-text">Příklad 1 z 96</span>
            </div>
            <div class="relative w-full h-4 bg-slate-800 rounded-full overflow-visible cursor-pointer" id="random-track">
                <div id="random-progress-bar" class="absolute top-0 left-0 h-full bg-amber-500 rounded-full transition-all duration-300 pointer-events-none" style="width: 1%;"></div>
                <input type="range" id="random-slider" min="0" max="95" value="0" class="absolute top-0 left-0 w-full h-full appearance-none bg-transparent cursor-pointer z-10">
            </div>
        </div>

        <!-- Tlačítka Předchozí a Následující -->
        <div class="flex justify-between gap-4 mb-2">
            <button id="prev-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow border border-slate-700 transition flex items-center justify-center gap-2 text-sm">
                ← Předchozí
            </button>
            <button id="next-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow border border-slate-700 transition flex items-center justify-center gap-2 text-sm">
                Následující →
            </button>
        </div>

        <!-- Karta s příkladem -->
        <div id="math-card" class="bg-white text-slate-900 rounded-2xl p-6 shadow-2xl border-4 border-slate-700 min-h-[150px] h-auto flex flex-col justify-center items-center text-center cursor-pointer relative overflow-visible transition-all">
            <div id="math-content" class="w-full overflow-x-auto overflow-y-visible py-2 px-1 text-lg md:text-xl font-medium">
                Načítání...
            </div>
            <div class="absolute bottom-1 right-3 text-[10px] text-slate-400 pointer-events-none">
                (Klepnutí / [Mezerník] / [Šipky] = Navigace)
            </div>
        </div>

        <!-- Přepínač režimu: Výsledek / Postup -->
        <div class="mt-4 bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-xs font-medium text-slate-300">Zobrazení v kartě:</span>
            <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-700 w-full sm:w-auto">
                <button id="mode-result" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow">
                    Jen výsledek
                </button>
                <button id="mode-steps" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">
                    Postup řešení
                </button>
            </div>
        </div>

        <!-- Pokročilá nastavení -->
        <div class="mt-3 space-y-2 bg-slate-800/50 p-3 rounded-xl border border-slate-800 text-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="no-worksheets-chk" class="w-4 h-4 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
                    <span class="font-medium text-slate-300">Režim bez pracovního listu (jen zadání)</span>
                </label>
                <label id="continuous-result-wrapper" class="flex items-center gap-2 cursor-pointer pl-6 sm:pl-0 opacity-50 pointer-events-none transition">
                    <input type="checkbox" id="continuous-result-chk" class="w-3.5 h-3.5 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
                    <span class="text-slate-400">Zobrazovat průběžně výsledky</span>
                </label>
            </div>

            <div class="border-t border-slate-700/60 pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="random-mode-chk" class="w-4 h-4 rounded text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                    <span class="font-medium text-amber-400">Režim náhodného předkládání (promíchat sadu)</span>
                </label>
                <div id="random-suboptions" class="mt-2 pl-6 space-y-1 hidden">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="interleave" checked class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Prokládat výsledky (zadání -> výsledek -> další)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="only-statements" class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Procházet jen zadání</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="random-sub" value="instant-results" class="text-amber-500 focus:ring-amber-400 bg-slate-900 border-slate-700">
                        <span class="text-slate-300">Zobrazovat ihned s výsledky</span>
                    </label>
                </div>
            </div>
        </div>

    </main>

    <!-- Zápatí -->
    <footer class="w-full max-w-2xl mx-auto p-4 border-t border-slate-800 text-center text-xs text-slate-500 flex justify-between items-center">
        <span>Matematický trenažér v1.14</span>
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="vibration-chk" checked class="w-3.5 h-3.5 rounded text-slate-600 focus:ring-slate-500 bg-slate-900 border-slate-700">
            <span>Hmatová odezva (vibrace)</span>
        </label>
    </footer>

    <!-- Logika aplikace -->
    <script>

            [78, "\\dfrac{\\sqrt{12} + \\sqrt{27}}{\\sqrt{3}}", "\\underline{\\underline{5}}", "\\frac{\\sqrt{12}+\\sqrt{27}}{\\sqrt{3}} = \\frac{2\\sqrt{3}+3\\sqrt{3}}{\\sqrt{3}} = \\frac{5\\sqrt{3}}{\\sqrt{3}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{5}}}"],
            [79, "\\sqrt{2} \\cdot \\sqrt{3} \\cdot \\sqrt{6}", "\\underline{\\underline{6}}", "\\sqrt{2 \\cdot 3 \\cdot 6} = \\sqrt{36} = \\bbox[#fef08a, 3px]{\\underline{\\underline{6}}}"],
            [80, "\\dfrac{\\sqrt{32} \\cdot \\sqrt{2}}{\\sqrt{16}}", "\\underline{\\underline{2}}", "\\frac{\\sqrt{64}}{4} = \\frac{8}{4} = \\bbox[#fef08a, 3px]{\\underline{\\underline{2}}}"],

            [81, "x^{\\frac{1}{2}} \\cdot x^{\\frac{1}{3}}", "\\underline{\\underline{x^{\\frac{5}{6}}}}", "x^{\\frac{1}{2}} \\cdot x^{\\frac{1}{3}} = x^{\\frac{1}{2}+\\frac{1}{3}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^{\\frac{5}{6}}}}}"],
            [82, "\\sqrt{x} \\cdot \\sqrt[3]{x^2}", "\\underline{\\underline{x^{\\frac{7}{6}}}}", "x^{\\frac{1}{2}} \\cdot x^{\\frac{2}{3}} = x^{\\frac{3+4}{6}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^{\\frac{7}{6}}}}}"],
            [83, "\\dfrac{\\sqrt[3]{a^2}}{\\sqrt{a}}", "\\underline{\\underline{a^{-\\frac{1}{6}}}}", "\\frac{a^{\\frac{2}{3}}}{a^{\\frac{1}{2}}} = a^{\\frac{2}{3}-\\frac{1}{2}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{a^{\\frac{1}{6}}}}}"],

            [85, "\\sqrt{x \\sqrt{x}}", "\\underline{\\underline{x^{\\frac{3}{4}}}}", "\\sqrt{x \\cdot x^{\\frac{1}{2}}} = \\sqrt{x^{\\frac{3}{2}}} = (x^{\\frac{3}{2}})^{\\frac{1}{2}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^{\\frac{3}{4}}}}}"],
            [86, "\\sqrt[3]{a \\cdot \\sqrt{a}}", "\\underline{\\underline{a^{\\frac{1}{2}}}}", "\\sqrt[3]{a \\cdot a^{\\frac{1}{2}}} = \\sqrt[3]{a^{\\frac{3}{2}}} = (a^{\\frac{3}{2}})^{\\frac{1}{3}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{a^{\\frac{1}{2}}}}}"],
            [87, "\\dfrac{x^2 \\cdot \\sqrt{x}}{\\sqrt[3]{x^2}}", "\\underline{\\underline{x^{\\frac{13}{6}}}}", "\\frac{x^2 \\cdot x^{\\frac{1}{2}}}{x^{\\frac{2}{3}}} = x^{2 + \\frac{1}{2} - \\frac{2}{3}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^{\\frac{13}{6}}}}}"],
            [88, "(\\sqrt[4]{x^3})^2", "\\underline{\\underline{x^{\\frac{3}{2}}}}", "(x^{\\frac{3}{4}})^2 = x^{\\frac{6}{4}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^{\\frac{3}{2}}}}}"],
            [89, "\\sqrt{8} + \\sqrt{32} - \\sqrt{18}", "\\underline{\\underline{3\\sqrt{2}}}", "2\\sqrt{2} + 4\\sqrt{2} - 3\\sqrt{2} = \\bbox[#fef08a, 3px]{\\underline{\\underline{3\\sqrt{2}}}]}"],
            [90, "\\sqrt{3} \\cdot \\sqrt[3]{9}", "\\underline{\\underline{3^{\\frac{5}{6}}}}", "3^{\\frac{1}{2}} \\cdot 3^{\\frac{2}{3}} = 3^{\\frac{3+4}{6}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{3^{\\frac{5}{6}}}}}"],
            [91, "\\dfrac{\\sqrt[4]{81}}{\\sqrt{9}}", "\\underline{\\underline{1}}", "\\frac{3}{3} = \\bbox[#fef08a, 3px]{\\underline{\\underline{1}}}"],
            [92, "\\sqrt{a^2 b} \\cdot \\sqrt{ab^3}", "\\underline{\\underline{ab^2\\sqrt{a}}}", "\\sqrt{a^3 b^4} = a b^2 \\sqrt{a} = \\bbox[#fef08a, 3px]{\\underline{\\underline{ab^2\\sqrt{a}}}]}"],
            [93, "\\dfrac{\\sqrt{27a^3}}{\\sqrt{3a}}", "\\underline{\\underline{3a}}", "\\sqrt{\\frac{27a^3}{3a}} = \\sqrt{9a^2} = \\bbox[#fef08a, 3px]{\\underline{\\underline{3a}}}"],
            [94, "(\\sqrt[3]{2x^2})^3", "\\underline{\\underline{2x^2}}", "(\\sqrt[3]{2x^2})^3 = \\bbox[#fef08a, 3px]{\\underline{\\underline{2x^2}}}"],
            [95, "\\sqrt{x^4 y^2}", "\\underline{\\underline{x^2 y}}", "\\sqrt{x^4 y^2} = x^{\\frac{4}{2}} y^{\\frac{2}{2}} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x^2 y}}}"],
            [96, "\\dfrac{\\sqrt{x^5}}{\\sqrt{x^3}}", "\\underline{\\underline{x}}", "\\sqrt{\\frac{x^5}{x^3}} = \\sqrt{x^2} = \\bbox[#fef08a, 3px]{\\underline{\\underline{x}}}"]
        ];

        let currentIndex = 0;
        let currentMode = 'result';
        let isRandomMode = false;
        let randomIndices = [];
        let randomStepPointer = 0;

        const mathCard = document.getElementById('math-card');
        const mathContent = document.getElementById('math-content');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const problemInput = document.getElementById('problem-input');
        const sliderRange = document.getElementById('slider-range');
        const currentChapterBadge = document.getElementById('current-chapter-badge');
        
        const modeResultBtn = document.getElementById('mode-result');
        const modeStepsBtn = document.getElementById('mode-steps');
        
        const noWorksheetsChk = document.getElementById('no-worksheets-chk');
        const continuousResultChk = document.getElementById('continuous-result-chk');
        const continuousResultWrapper = document.getElementById('continuous-result-wrapper');
        
        const randomModeChk = document.getElementById('random-mode-chk');
        const randomSuboptions = document.getElementById('random-suboptions');
        const sequentialNavContainer = document.getElementById('sequential-nav-container');
        const randomNavContainer = document.getElementById('random-nav-container');
        const randomProgressBar = document.getElementById('random-progress-bar');
        const randomProgressText = document.getElementById('random-progress-text');
        const randomSlider = document.getElementById('random-slider');
        const vibrationChk = document.getElementById('vibration-chk');

        function getChapterInfo(idx) {
            if (idx <= 24) return { text: "I. Základní odmocniny", color: "text-blue-400" };
            if (idx <= 64) return { text: "II. Částečné odmocňování", color: "text-emerald-400" };
            if (idx <= 80) return { text: "III. Operace s odmocninami", color: "text-amber-400" };
            return { text: "IV. Kombinace a rac. exponenty", color: "text-purple-400" };
        }

        function initRandomIndices() {
            randomIndices = Array.from({length: problems.length}, (_, i) => i);
            for (let i = randomIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [randomIndices[i], randomIndices[j]] = [randomIndices[j], randomIndices[i]];
            }
            randomStepPointer = 0;
        }

        function vibrate() {
            if (vibrationChk.checked && navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        function hasDetailedSteps(problem) {
            const steps = problem[3];
            const equalsCount = (steps.match(/=/g) || []).length;
            return equalsCount > 1;
        }

        function updateStepsButtonState(problem) {
            if (hasDetailedSteps(problem)) {
                modeStepsBtn.removeAttribute('disabled');
            } else {
                modeStepsBtn.setAttribute('disabled', 'true');
                currentMode = 'result';
                modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
                modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
            }
        }

        function render() {
            let pIndex;
            if (isRandomMode) {
                pIndex = randomIndices[currentIndex];
            } else {
                pIndex = currentIndex;
            }

            const problem = problems[pIndex];
            const probNum = problem[0];
            const statement = problem[1];
            const answer = problem[2];
            const steps = problem[3];

            updateStepsButtonState(problem);

            let htmlString = "";

            if (isRandomMode) {
                const subOpt = document.querySelector('input[name="random-sub"]:checked').value;
                
                if (subOpt === 'only-statements') {
                    htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                } else if (subOpt === 'instant-results') {
                    htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                } else {
                    if (randomStepPointer === 0) {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                    }
                }

                const progressPct = ((currentIndex + 1) / problems.length) * 100;
                randomProgressBar.style.width = `${progressPct}%`;
                randomProgressText.innerText = `Příklad ${currentIndex + 1} z 96`;
                randomSlider.value = currentIndex;

            } else {
                const noWorksheets = noWorksheetsChk.checked;
                const isContinuous = continuousResultChk.checked;

                if (noWorksheets) {
                    if (isContinuous) {
                        if (currentMode === 'steps' && hasDetailedSteps(problem)) {
                            htmlString = `\\mathbf{${probNum})} \\quad ${steps}`;
                        } else {
                            htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                        }
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = `;
                    }
                } else {
                    if (currentMode === 'steps' && hasDetailedSteps(problem)) {
                        htmlString = `\\mathbf{${probNum})} \\quad ${steps}`;
                    } else {
                        htmlString = `\\mathbf{${probNum})} \\quad ${statement} = \\bbox[#fef08a, 3px]{${answer}}`;
                    }
                }

                problemInput.value = probNum;
                sliderRange.value = probNum;
                
                const chapterInfo = getChapterInfo(probNum);
                currentChapterBadge.innerText = chapterInfo.text;
                currentChapterBadge.className = `px-2 py-0.5 bg-slate-800 rounded font-medium ${chapterInfo.color}`;
            }

            mathContent.innerHTML = `$${htmlString}$`;

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([mathContent]).catch((err) => console.log(err));
            }
        }

        function goNext() {
            vibrate();
            if (isRandomMode) {
                const subOpt = document.querySelector('input[name="random-sub"]:checked').value;
                if (subOpt === 'interleave') {
                    if (randomStepPointer === 0) {
                        randomStepPointer = 1;
                        render();
                        return;
                    } else {
                        randomStepPointer = 0;
                    }
                }
                
                if (currentIndex < problems.length - 1) {
                    currentIndex++;
                    render();
                } else {
                    alert("Gratulace! Dosaženo konce náhodné sady.");
                    randomModeChk.checked = false;
                    randomModeChk.dispatchEvent(new Event('change'));
                }
            } else {
                const noWorksheets = noWorksheetsChk.checked;
                const isContinuous = continuousResultChk.checked;
                const pIndex = currentIndex;
                const problem = problems[pIndex];

                if (noWorksheets && isContinuous && currentMode === 'result') {
                    if (hasDetailedSteps(problem)) {
                        currentMode = 'steps';
                        modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
                        modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white";
                    } else {
                        currentMode = 'result';
                    }
                    render();
                    return;
                }

                currentMode = 'result';
                modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
                modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";

                if (currentIndex < problems.length - 1) {
                    currentIndex++;
                    render();
                } else {
                    currentIndex = 0;
                    render();
                }
            }
        }

        function goPrev() {
            vibrate();
            if (isRandomMode) {
                randomStepPointer = 0;
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                }
            } else {
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                } else {
                    currentIndex = problems.length - 1;
                    render();
                }
            }
        }

        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);
        mathCard.addEventListener('click', goNext);

        // Ovládání klávesnicí (Mezerník, Šipka vpravo, Šipka vlevo)
        window.addEventListener('keydown', (e) => {
            // Nezasahovat do psaní v inputu čísla příkladu
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;

            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                goNext();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                goPrev();
            }
        });

        modeResultBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentMode = 'result';
            modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
            modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
            render();
        });

        modeStepsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (modeStepsBtn.hasAttribute('disabled')) return;
            currentMode = 'steps';
            modeStepsBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition bg-slate-700 text-white shadow";
            modeResultBtn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-medium rounded-md transition text-slate-400 hover:text-white";
            render();
        });

        noWorksheetsChk.addEventListener('change', () => {
            if (noWorksheetsChk.checked) {
                continuousResultWrapper.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                continuousResultWrapper.classList.add('opacity-50', 'pointer-events-none');
            }
            currentMode = 'result';
            render();
        });

        continuousResultChk.addEventListener('change', () => render());

        randomModeChk.addEventListener('change', () => {
            isRandomMode = randomModeChk.checked;
            if (isRandomMode) {
                noWorksheetsChk.checked = false;
                continuousResultWrapper.classList.add('opacity-50', 'pointer-events-none');
                randomSuboptions.classList.remove('hidden');
                sequentialNavContainer.classList.add('hidden');
                randomNavContainer.classList.remove('hidden');
                initRandomIndices();
                currentIndex = 0;
            } else {
                randomSuboptions.classList.add('hidden');
                randomNavContainer.classList.add('hidden');
                sequentialNavContainer.classList.remove('hidden');
                currentIndex = 0;
            }
            currentMode = 'result';
            render();
        });

        document.querySelectorAll('input[name="random-sub"]').forEach(radio => {
            radio.addEventListener('change', () => {
                randomStepPointer = 0;
                render();
            });
        });

        problemInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 96) val = 96;
            currentIndex = val - 1;
            currentMode = 'result';
            render();
        });

        sliderRange.addEventListener('input', (e) => {
            currentIndex = parseInt(e.target.value) - 1;
            currentMode = 'result';
            render();
        });

        randomSlider.addEventListener('input', (e) => {
            currentIndex = parseInt(e.target.value);
            randomStepPointer = 0;
            render();
        });

        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
