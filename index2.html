<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procvičování - Odmocniny a mocniny</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MathJax Config & Script -->
  <script>
    window.MathJax = {

        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true

      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* Prevent text selection when tapping rapidly */
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    /* MathJax sizing & contrast */
    .mjx-chtml {
      font-size: 110% !important;
      color: #0f172a !important;
    }
    
    @media (min-width: 640px) {
      .mjx-chtml {
        font-size: 130% !important;
      }
    }

    /* Custom horizontal scrollbar for long math equations */
    .math-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .math-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .math-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .math-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

</head>

      </div>
    </header>

      <!-- Info Header -->

        <div id="chapter-label" class="text-indigo-600 truncate max-w-[200px] sm:max-w-xs font-bold">
          1. Základní odmocniny
        </div>
        <div class="flex items-center gap-1 bg-white px-2.5 py-1 rounded-lg border border-slate-200 shadow-sm">
          <span class="text-slate-400">Příklad</span>

          <span class="text-slate-400">/ 96</span>
        </div>
      </div>

      <!-- Slider -->
      <div class="relative w-full flex items-center">
        <input type="range" id="progress-slider" min="1" max="96" value="1"

      </div>

      <!-- Colored Subchapters Bar (Visible in Sequential Mode) -->
      <div id="subchapters-bar" class="grid grid-cols-4 gap-1 h-1.5 w-full rounded-full overflow-hidden mt-0.5">
        <div title="1. Základní odmocniny (1-24)" class="bg-emerald-400 h-full"></div>
        <div title="2. Částečné odmocniny a proměnné (25-64)" class="bg-blue-400 h-full"></div>
        <div title="3. Operace s odmocninami (65-80)" class="bg-amber-400 h-full"></div>
        <div title="4. Kombinace s mocninami (81-96)" class="bg-purple-400 h-full"></div>
      </div>
    </section>

          class="relative bg-gradient-to-b from-white to-slate-50/50 border-2 border-indigo-200 hover:border-indigo-400 rounded-3xl p-4 sm:p-8 shadow-lg min-h-[220px] sm:min-h-[260px] flex flex-col justify-center items-center cursor-pointer transition-all duration-200 active:scale-[0.99] group">
      
      <!-- Tap hint -->
      <span class="absolute top-3 right-4 text-[10px] sm:text-xs font-medium text-slate-400 group-hover:text-indigo-500 transition-colors">
        Klepnutím ➔ Další
      </span>

      <!-- Math Equation Container with Horizontal Scrollbar -->
      <div class="w-full overflow-x-auto math-scroll py-4 px-1 flex justify-center items-center">
        <div id="math-content" class="tex2jax_process text-center text-slate-900 text-lg sm:text-2xl font-medium whitespace-nowrap">
          <!-- MathJax renders here -->
        </div>
      </div>
    </main>

    <!-- NAVIGATION BUTTONS (DIRECTLY BELOW MATH CARD) -->

      <button id="btn-prev"

            <span>Zobrazovat průběžně výsledky</span>
          </label>
        </div>
      </div>

      <!-- Režim náhodného předkládání -->
      <div class="flex flex-col gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
        <label class="flex items-center gap-2.5 cursor-pointer">

            <span>Procházet jen zadání</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
            <input type="radio" name="random-sub-mode" value="with-results" class="w-3.5 h-3.5 text-amber-600 focus:ring-amber-500">
            <span>Zobrazovat ihned s výsledky</span>
          </label>
        </div>

      { id: 64, sub: "2. Částečné odmocňování a proměnné", q: "\\sqrt[3]{16a^4 b^5}", step: "= 2ab\\sqrt[3]{2ab^2}", res: "2ab\\sqrt[3]{2ab^2}" },

      // STRANA 3: Operace s odmocninami (65-80)
      { id: 65, sub: "3. Operace s odmocninami", q: "\\sqrt{3} \\cdot \\sqrt{12}", step: "= \\sqrt{36} = 6", res: "6" },

      { id: 71, sub: "3. Operace s odmocninami", q: "\\sqrt{50} - \\sqrt{18}", step: "= 5\\sqrt{2} - 3\\sqrt{2} = 2\\sqrt{2}", res: "2\\sqrt{2}" },
      { id: 72, sub: "3. Operace s odmocninami", q: "\\sqrt{27} + \\sqrt{12}", step: "= 3\\sqrt{3} + 2\\sqrt{3} = 5\\sqrt{3}", res: "5\\sqrt{3}" },
      { id: 73, sub: "3. Operace s odmocninami", q: "(2\\sqrt{3})^2", step: "= 2^2 \\cdot 3 = 4 \\cdot 3 = 12", res: "12" },
      { id: 74, sub: "3. Operace s odmocninami", q: "(-3\\sqrt{2})^2", step: "= (-3)^2 \\cdot 2 = 9 \\cdot 2 = 18", res: "18" },
      { id: 75, sub: "3. Operace s odmocninami", q: "(\\sqrt{5} + 2)(\\sqrt{5} - 2)", step: "= (\\sqrt{5})^2 - 2^2 = 5 - 4 = 1", res: "1" },
      { id: 76, sub: "3. Operace s odmocninami", q: "(\\sqrt{3} + 1)^2", step: "= 3 + 2\\sqrt{3} + 1 = 4 + 2\\sqrt{3}", res: "4 + 2\\sqrt{3}" },
      { id: 77, sub: "3. Operace s odmocninami", q: "\\sqrt{2} \\cdot (\\sqrt{8} + \\sqrt{18})", step: "= \\sqrt{16} + \\sqrt{36} = 4 + 6 = 10", res: "10" },
      { id: 78, sub: "3. Operace s odmocninami", q: "\\dfrac{\\sqrt{12} + \\sqrt{27}}{\\sqrt{3}}", step: "= \\dfrac{2\\sqrt{3} + 3\\sqrt{3}}{\\sqrt{3}} = \\dfrac{5\\sqrt{3}}{\\sqrt{3}} = 5", res: "5" },
      { id: 79, sub: "3. Operace s odmocninami", q: "\\sqrt{2} \\cdot \\sqrt{3} \\cdot \\sqrt{6}", step: "= \\sqrt{36} = 6", res: "6" },
      { id: 80, sub: "3. Operace s odmocninami", q: "\\dfrac{\\sqrt{32} \\cdot \\sqrt{2}}{\\sqrt{16}}", step: "= \\dfrac{\\sqrt{64}}{4} = \\dfrac{8}{4} = 2", res: "2" },

      // STRANA 4: Kombinace s mocninami a racionálními exponenty (81-96)
      { id: 81, sub: "4. Kombinace s mocninami", q: "x^{\\frac{1}{2}} \\cdot x^{\\frac{1}{3}}", step: "= x^{\\frac{1}{2}+\\frac{1}{3}} = x^{\\frac{5}{6}} = \\sqrt[6]{x^5}", res: "\\sqrt[6]{x^5}" },
      { id: 82, sub: "4. Kombinace s mocninami", q: "\\sqrt{x} \\cdot \\sqrt[3]{x^2}", step: "= x^{\\frac{1}{2}} \\cdot x^{\\frac{2}{3}} = x^{\\frac{7}{6}} = x\\sqrt[6]{x}", res: "x\\sqrt[6]{x}" },
      { id: 83, sub: "4. Kombinace s mocninami", q: "\\dfrac{\\sqrt[3]{a^2}}{\\sqrt{a}}", step: "= \\dfrac{a^{\\frac{2}{3}}}{a^{\\frac{1}{2}}} = a^{\\frac{2}{3}-\\frac{1}{2}} = a^{\\frac{1}{6}} = \\sqrt[6]{a}", res: "\\sqrt[6]{a}" },
      { id: 84, sub: "4. Kombinace s mocninami", q: "\\left(\\sqrt{a^3}\\right)^{\\frac{1}{3}}", step: "= \\left(a^{\\frac{3}{2}}\\right)^{\\frac{1}{3}} = a^{\\frac{1}{2}} = \\sqrt{a}", res: "\\sqrt{a}" },
      { id: 85, sub: "4. Kombinace s mocninami", q: "\\sqrt{x \\sqrt{x}}", step: "= \\sqrt{x \\cdot x^{\\frac{1}{2}}} = \\sqrt{x^{\\frac{3}{2}}} = x^{\\frac{3}{4}} = \\sqrt[4]{x^3}", res: "\\sqrt[4]{x^3}" },
      { id: 86, sub: "4. Kombinace s mocninami", q: "\\sqrt[3]{a \\cdot \\sqrt{a}}", step: "= \\sqrt[3]{a^{\\frac{3}{2}}} = a^{\\frac{1}{2}} = \\sqrt{a}", res: "\\sqrt{a}" },
      { id: 87, sub: "4. Kombinace s mocninami", q: "\\dfrac{x^2 \\cdot \\sqrt{x}}{\\sqrt[3]{x^2}}", step: "= \\dfrac{x^{\\frac{5}{2}}}{x^{\\frac{2}{3}}} = x^{\\frac{5}{2}-\\frac{2}{3}} = x^{\\frac{11}{6}} = x\\sqrt[6]{x^5}", res: "x\\sqrt[6]{x^5}" },
      { id: 88, sub: "4. Kombinace s mocninami", q: "\\left(\\sqrt[4]{x^3}\\right)^2", step: "= x^{\\frac{3}{4} \\cdot 2} = x^{\\frac{3}{2}} = x\\sqrt{x}", res: "x\\sqrt{x}" },
      { id: 89, sub: "4. Kombinace s mocninami", q: "\\sqrt{8} + \\sqrt{32} - \\sqrt{18}", step: "= 2\\sqrt{2} + 4\\sqrt{2} - 3\\sqrt{2} = 3\\sqrt{2}", res: "3\\sqrt{2}" },
      { id: 90, sub: "4. Kombinace s mocninami", q: "\\sqrt{3} \\cdot \\sqrt[3]{9}", step: "= 3^{\\frac{1}{2}} \\cdot 3^{\\frac{2}{3}} = 3^{\\frac{7}{6}} = 3\\sqrt[6]{3}", res: "3\\sqrt[6]{3}" },
      { id: 91, sub: "4. Kombinace s mocninami", q: "\\dfrac{\\sqrt[4]{81}}{\\sqrt{9}}", step: "= \\dfrac{3}{3} = 1", res: "1" },
      { id: 92, sub: "4. Kombinace s mocninami", q: "\\sqrt{a^2 b} \\cdot \\sqrt{ab^3}", step: "= \\sqrt{a^3 b^4} = ab^2\\sqrt{a}", res: "ab^2\\sqrt{a}" },
      { id: 93, sub: "4. Kombinace s mocninami", q: "\\dfrac{\\sqrt{27a^3}}{\\sqrt{3a}}", step: "= \\sqrt{\\dfrac{27a^3}{3a}} = \\sqrt{9a^2} = 3a", res: "3a" },
      { id: 94, sub: "4. Kombinace s mocninami", q: "\\left(\\sqrt[3]{2x^2}\\right)^3", step: "= 2x^2", res: "2x^2" },
      { id: 95, sub: "4. Kombinace s mocninami", q: "\\sqrt{x^4 y^2}", step: "= x^2 y", res: "x^2 y" },
      { id: 96, sub: "4. Kombinace s mocninami", q: "\\dfrac{\\sqrt{x^5}}{\\sqrt{x^3}}", step: "= \\sqrt{\\dfrac{x^5}{x^3}} = \\sqrt{x^2} = x", res: "x" }
    ];

    // APPLICATION STATE
    let currentIndex = 0; // 0 to 95
    let showStepByStep = false;
    let isRandomMode = false;
    let noWorksheetMode = false;
    let showProgressively = true;
    let revealStage = 0; // 0 = problem only, 1 = answer revealed
    
    let randomOrder = [];
    let randomPointer = 0;

    // DOM ELEMENTS
    const mathContent = document.getElementById('math-content');
    const mathCard = document.getElementById('math-card');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const progressSlider = document.getElementById('progress-slider');
    const inputIndex = document.getElementById('input-index');
    const chapterLabel = document.getElementById('chapter-label');
    const subchaptersBar = document.getElementById('subchapters-bar');

    const detailToggleContainer = document.getElementById('detail-toggle-container');
    const modeResultOnly = document.getElementById('mode-result-only');
    const modeStepByStep = document.getElementById('mode-step-by-step');

    const chkNoWorksheet = document.getElementById('chk-no-worksheet');
    const chkShowProgressively = document.getElementById('chk-show-progressively');
    const subOptionContainer = document.getElementById('sub-option-container');

    const chkRandomMode = document.getElementById('chk-random-mode');
    const randomOptionsContainer = document.getElementById('random-options-container');

    const chkVibration = document.getElementById('chk-vibration');
    const congratsModal = document.getElementById('congrats-modal');
    const btnRestartRandom = document.getElementById('btn-restart-random');

    // Haptic vibration helper
    function triggerVibration() {
      if (chkVibration.checked && navigator.vibrate) {
        navigator.vibrate(20);
      }
    }

    // MAIN RENDER FUNCTION
    function renderCurrentProblem() {
      const activeIdx = isRandomMode ? randomOrder[randomPointer] : currentIndex;
      const prob = problemsData[activeIdx];

      // Update Slider & Headers
      if (!isRandomMode) {
        progressSlider.value = activeIdx + 1;
        inputIndex.value = activeIdx + 1;
        chapterLabel.innerText = prob.sub;
        chapterLabel.classList.remove('hidden');
        subchaptersBar.classList.remove('hidden');
      } else {
        progressSlider.value = randomPointer + 1;
        inputIndex.value = randomPointer + 1;
        chapterLabel.innerText = `Náhodně: ${randomPointer + 1} z 96`;
        subchaptersBar.classList.add('hidden');
      }

      // Get selected random sub-mode if active
      const randomSubMode = document.querySelector('input[name="random-sub-mode"]:checked')?.value || "interleaved";

      // Build LaTeX Math string
      let latexStr = "";

      // Hide prefix number in Random Mode
      if (!isRandomMode) {
        latexStr += `\\mathbf{${prob.id}\\;)} \\quad `;
      }

      latexStr += prob.q;

      // Construct Result/Step logic
      if (isRandomMode) {
        if (randomSubMode === "questions-only") {
          latexStr += ` = \\; ?`;
        } else if (randomSubMode === "with-results") {
          if (showStepByStep) {
            latexStr += ` ${prob.step} = ${highlightRes(prob.res)}`;
          } else {
            latexStr += ` = ${highlightRes(prob.res)}`;
          }
        } else { // "interleaved"
          if (revealStage === 1) {
            if (showStepByStep) {
              latexStr += ` ${prob.step} = ${highlightRes(prob.res)}`;
            } else {
              latexStr += ` = ${highlightRes(prob.res)}`;
            }
          } else {
            latexStr += ` = \\; ?`;
          }
        }
      } else if (noWorksheetMode) {
        if (showProgressively) {
          if (revealStage === 1) {
            if (showStepByStep) {
              latexStr += ` ${prob.step} = ${highlightRes(prob.res)}`;
            } else {
              latexStr += ` = ${highlightRes(prob.res)}`;
            }
          } else {
            latexStr += ` = \\; ?`;
          }
        } else {
          latexStr += ` = \\; ?`;
        }
      } else {
        // Standard mode with worksheet
        if (showStepByStep) {
          // Yellow highlighted answer appears ONCE at the end of the steps
          latexStr += ` ${prob.step} = ${highlightRes(prob.res)}`;
        } else {
          latexStr += ` = ${highlightRes(prob.res)}`;
        }
      }

      // Render MathJax
      mathContent.innerHTML = `$${latexStr}$`;
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([mathContent]).catch((err) => console.log(err));
      }

      // Enable/Disable Prev Button
      if (isRandomMode) {
        btnPrev.disabled = (randomPointer === 0);
      } else {
        btnPrev.disabled = (currentIndex === 0);
      }
    }

    // NEXT NAVIGATION
    function goNext() {
      triggerVibration();

      const randomSubMode = document.querySelector('input[name="random-sub-mode"]:checked')?.value || "interleaved";

      // Interleaved logic for Random mode
      if (isRandomMode && randomSubMode === "interleaved" && revealStage === 0) {
        revealStage = 1;
        renderCurrentProblem();
        return;
      }

      // Progressive logic for Worksheet-Free mode
      if (!isRandomMode && noWorksheetMode && showProgressively && revealStage === 0) {
        revealStage = 1;
        renderCurrentProblem();
        return;
      }

      // Reset reveal stage
      revealStage = 0;

      // Advance
      if (isRandomMode) {
        if (randomPointer < 95) {
          randomPointer++;
          resetDetailModeOnForward();
          renderCurrentProblem();
        } else {
          congratsModal.classList.remove('hidden');
        }
      } else {
        if (currentIndex < 95) {
          currentIndex++;
          resetDetailModeOnForward();
          renderCurrentProblem();
        }
      }
    }

    // PREVIOUS NAVIGATION
    function goPrev() {
      triggerVibration();
      revealStage = 0;

      if (isRandomMode) {
        if (randomPointer > 0) {
          randomPointer--;
          renderCurrentProblem();
        }
      } else {
        if (currentIndex > 0) {
          currentIndex--;
          renderCurrentProblem();
        }
      }
    }

    // Reset to "Jen výsledek" on moving forward
    function resetDetailModeOnForward() {
      showStepByStep = false;
      updateDetailToggleUI();
    }

    function updateDetailToggleUI() {
      if (showStepByStep) {
        modeStepByStep.className = "px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
        modeResultOnly.className = "px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900";
      } else {
        modeResultOnly.className = "px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
        modeStepByStep.className = "px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900";
      }
    }

    // EVENT LISTENERS

    btnNext.addEventListener('click', goNext);
    btnPrev.addEventListener('click', goPrev);

    // Tap card to move next
    mathCard.addEventListener('click', (e) => {
      goNext();
    });

    // Slider input (Works in both Sequential and Random modes)
    progressSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value) - 1;
      revealStage = 0;
      if (isRandomMode) {
        randomPointer = val;
      } else {
        currentIndex = val;
      }
      renderCurrentProblem();
    });

    // Direct input box
    inputIndex.addEventListener('change', (e) => {
      let val = parseInt(e.target.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 96) val = 96;
      
      revealStage = 0;
      if (isRandomMode) {
        randomPointer = val - 1;
      } else {
        currentIndex = val - 1;
      }
      renderCurrentProblem();
    });

    // Detail Mode Toggles
    modeResultOnly.addEventListener('click', () => {
      showStepByStep = false;
      updateDetailToggleUI();
      renderCurrentProblem();
    });

    modeStepByStep.addEventListener('click', () => {
      showStepByStep = true;
      updateDetailToggleUI();
      renderCurrentProblem();
    });

    // Worksheet-free Mode
    chkNoWorksheet.addEventListener('change', (e) => {
      noWorksheetMode = e.target.checked;
      revealStage = 0;
      
      if (noWorksheetMode) {
        subOptionContainer.classList.remove('hidden');
        // Automatically uncheck random mode
        if (isRandomMode) {
          chkRandomMode.checked = false;
          isRandomMode = false;
          randomOptionsContainer.classList.add('hidden');
        }
      } else {
        subOptionContainer.classList.add('hidden');
      }
      renderCurrentProblem();
    });

    chkShowProgressively.addEventListener('change', (e) => {
      showProgressively = e.target.checked;
      revealStage = 0;
      renderCurrentProblem();
    });

    // Random Mode
    chkRandomMode.addEventListener('change', (e) => {
      isRandomMode = e.target.checked;
      revealStage = 0;

      if (isRandomMode) {
        randomOptionsContainer.classList.remove('hidden');
        // Automatically uncheck worksheet-free mode
        if (noWorksheetMode) {
          chkNoWorksheet.checked = false;
          noWorksheetMode = false;
          subOptionContainer.classList.add('hidden');
        }

        // Shuffle deck
        randomOrder = Array.from({ length: 96 }, (_, i) => i);
        for (let i = randomOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [randomOrder[i], randomOrder[j]] = [randomOrder[j], randomOrder[i]];
        }
        randomPointer = 0;
      } else {
        randomOptionsContainer.classList.add('hidden');
      }

      renderCurrentProblem();
    });

    // Random sub-mode radio buttons
    document.querySelectorAll('input[name="random-sub-mode"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        revealStage = 0;
        renderCurrentProblem();
      });
    });

    // Restart random deck
    btnRestartRandom.addEventListener('click', () => {
      congratsModal.classList.add('hidden');
      randomPointer = 0;
      renderCurrentProblem();
    });

    // INIT
    window.onload = function() {
      renderCurrentProblem();
    };
  </script>
</body>
