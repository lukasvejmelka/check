<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odmocniny a Mocniny - Řešení příkladů</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            touch-action: manipulation;
        }

        /* Smooth Card Transition */
        .card-enter {
            animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Light Cards & Glass Effect */
        .light-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
        }

        .light-button {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            transition: all 0.15s ease;
        }

        .light-button:active {
            transform: scale(0.96);
            background: #f1f5f9;
        }

        /* Hide Number Input Spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Custom Segmented Control */
        .toggle-container {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        /* MathJax Typography - Dark Sharp Text on Light Background */
        .mjx-chtml {
            font-size: 135% !important;
            color: #020617 !important;
            outline: none !important;
        }

        @media (max-width: 480px) {
            .mjx-chtml {
                font-size: 118% !important;
            }
        }

        /* Prevent text selection during swiping */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

            { id: 95, expr: "\\sqrt{x^4 y^2}", steps: "\\underline{\\underline{x^2 y}}", result: "\\underline{\\underline{x^2 y}}", cat: "Úpravy výrazů" },
            { id: 96, expr: "\\dfrac{\\sqrt{x^5}}{\\sqrt{x^3}}", steps: "\\sqrt{x^2} = \\underline{\\underline{x}}", result: "\\underline{\\underline{x}}", cat: "Podíl mocnin" }
        ];

        // State variables
        let currentIndex = 0; // 0 to 95
        let activeMode = 'result'; // 'result' | 'steps'

        // DOM Element references
        const problemInput = document.getElementById('problemInput');
        const mathContainer = document.getElementById('mathContainer');
        const categoryBadge = document.getElementById('categoryBadge');
        const cardContent = document.getElementById('cardContent');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const modeResultBtn = document.getElementById('modeResult');
        const modeStepsBtn = document.getElementById('modeSteps');
        const toggleIndicator = document.getElementById('toggleIndicator');
        const swipeCard = document.getElementById('swipeCard');

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            renderProblem();
            updateToggleUI();
            setupSwipeGestures();
        });

        // Navigation logic
        function navigate(direction) {
            // direction: 1 = FORWARD (next), -1 = BACKWARD (previous)
            if (direction === 1) {
                if (currentIndex < exercises.length - 1) {
                    currentIndex++;
                    // Forward movement resets mode to 'result'
                    activeMode = 'result';
                } else {
                    return;
                }
            } else if (direction === -1) {
                if (currentIndex > 0) {
                    currentIndex--;
                    // Backward movement keeps current active mode
                } else {
                    return;
                }
            }

            updateToggleUI();
            renderProblem();
        }

        // Jump directly to specific problem ID
        function jumpTo(id) {
            const targetIndex = Math.max(0, Math.min(exercises.length - 1, id - 1));
            if (targetIndex !== currentIndex) {
                currentIndex = targetIndex;
                renderProblem();
            }
        }

        // Handle user typing into input box
        function onInputChange() {
            let val = parseInt(problemInput.value, 10);
            if (isNaN(val)) val = 1;
            if (val < 1) val = 1;
            if (val > 96) val = 96;

            jumpTo(val);
        }

        // Set display mode manually (Jen výsledek vs. Postup)
        function setMode(mode) {
            if (activeMode !== mode) {
                activeMode = mode;
                updateToggleUI();
                renderProblem(false);
            }
        }

        // Update toggle switch visual position and styles
        function updateToggleUI() {
            if (activeMode === 'result') {
                toggleIndicator.style.transform = 'translateX(0%)';
                modeResultBtn.classList.add('text-slate-900');
                modeResultBtn.classList.remove('text-slate-500');
                modeStepsBtn.classList.add('text-slate-500');
                modeStepsBtn.classList.remove('text-slate-900');
            } else {
                toggleIndicator.style.transform = 'translateX(100%)';
                modeStepsBtn.classList.add('text-slate-900');
                modeStepsBtn.classList.remove('text-slate-500');
                modeResultBtn.classList.add('text-slate-500');
                modeResultBtn.classList.remove('text-slate-900');
            }
        }

        // Render mathematical formula with LaTeX numbering and MathJax
        function renderProblem(animate = true) {
            const ex = exercises[currentIndex];

            // Update UI elements
            problemInput.value = ex.id;
            categoryBadge.textContent = ex.cat;

            // Enable / Disable buttons at bounds
            btnPrev.style.opacity = currentIndex === 0 ? "0.4" : "1";
            btnPrev.style.pointerEvents = currentIndex === 0 ? "none" : "auto";

            btnNext.style.opacity = currentIndex === exercises.length - 1 ? "0.4" : "1";
            btnNext.style.pointerEvents = currentIndex === exercises.length - 1 ? "none" : "auto";

            // Trigger smooth CSS animation
            if (animate) {
                cardContent.classList.remove('card-enter');
                void cardContent.offsetWidth; // Force reflow
                cardContent.classList.add('card-enter');
            }

            // LaTeX formatting with problem number prefix in LaTeX format: \mathbf{id)} \quad
            const numberPrefix = `\\mathbf{${ex.id})} \\quad `;
            let texFormula = '';

            if (activeMode === 'result') {
                texFormula = `$$ ${numberPrefix} ${ex.expr} = ${ex.result} $$`;
            } else {
                texFormula = `$$ ${numberPrefix} ${ex.expr} = ${ex.steps} $$`;
            }

            // Insert into DOM
            mathContainer.innerHTML = texFormula;

            // Trigger MathJax render
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([mathContainer]).catch((err) => console.error(err));
            }
        }

        // Touch Swipe Gesture Implementation for Mobile Gallery Feel
        function setupSwipeGestures() {
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            const minSwipeDistance = 45; // Minimum horizontal pixel drag to register swipe

            swipeCard.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            swipeCard.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipeGesture();
            }, { passive: true });

            function handleSwipeGesture() {
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;

                // Ensure movement is mostly horizontal (not vertical scroll)
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
                    if (deltaX < 0) {
                        // Swiped Left -> Go to NEXT problem
                        navigate(1);
                    } else {
                        // Swiped Right -> Go to PREVIOUS problem
                        navigate(-1);
                    }
                }
            }
        }

        // Keyboard Arrow Navigation
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === problemInput) {
                if (e.key === 'Enter') {
                    problemInput.blur();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                navigate(-1);
            } else if (e.key === 'ArrowRight') {
                navigate(1);
            }
        });
    </script>
